y="198" r="16" fill="#16201D"/><text x="696" y="205" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="726" y="202" font-size="23" font-weight="700" fill="#16201D" text-anchor="start">Flower</text><text x="726" y="230" font-size="19" font-weight="400" fill="#4B5B55" text-anchor="start">Bold, unbroken black line</text><circle cx="696" cy="264" r="16" fill="#16201D"/><text x="696" y="271" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="726" y="268" font-size="23" font-weight="700" fill="#16201D" text-anchor="start">Pearling</text><text x="726" y="296" font-size="19" font-weight="400" fill="#4B5B55" text-anchor="start">Dense, even, reaching the face</text><circle cx="696" cy="330" r="16" fill="#16201D"/><text x="696" y="337" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="726" y="334" font-size="23" font-weight="700" fill="#16201D" text-anchor="start">Color</text><text x="726" y="362" font-size="19" font-weight="400" fill="#4B5B55" text-anchor="start">Rich and even, no washed-out patches</text><circle cx="696" cy="396" r="16" fill="#16201D"/><text x="696" y="403" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="726" y="400" font-size="23" font-weight="700" fill="#16201D" text-anchor="start">Body</text><text x="726" y="428" font-size="19" font-weight="400" fill="#4B5B55" text-anchor="start">Thick and deep, no bent spine</text><circle cx="696" cy="462" r="16" fill="#16201D"/><text x="696" y="469" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="726" y="466" font-size="23" font-weight="700" fill="#16201D" text-anchor="start">Eyes</text><text x="726" y="494" font-size="19" font-weight="400" fill="#4B5B55" text-anchor="start">Clear, bright, matching</text><circle cx="696" cy="528" r="16" fill="#16201D"/><text x="696" y="535" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="726" y="532" font-size="23" font-weight="700" fill="#16201D" text-anchor="start">Fins and tail</text><text x="726" y="560" font-size="19" font-weight="400" fill="#4B5B55" text-anchor="start">Whole, spread wide, no splits</text><circle cx="696" cy="594" r="16" fill="#16201D"/><text x="696" y="601" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="726" y="598" font-size="23" font-weight="700" fill="#16201D" text-anchor="start">Behavior</text><text x="726" y="626" font-size="19" font-weight="400" fill="#4B5B55" text-anchor="start">Alert, comes to the glass, eats</text>
