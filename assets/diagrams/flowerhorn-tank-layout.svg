<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"><title>Flowerhorn tank layout seen from above (75 gallon, 48 x 18 in)</title>
