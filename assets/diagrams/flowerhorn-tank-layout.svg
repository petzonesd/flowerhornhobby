<text x="600" y="60" font-size="24" font-weight="700" fill="#A62F28" text-anchor="middle">Secure, weighted lid over the whole top</text><rect x="136" y="126" width="928" height="366" rx="10" fill="none" stroke="#A62F28" stroke-width="3" stroke-dasharray="12 8"/><rect x="150" y="140" width="900" height="338" fill="#DCEDEA" stroke="#16201D" stroke-width="6"/><text x="600" y="110" font-size="20" font-weight="400" fill="#4B5B55" text-anchor="middle">Back glass</text><text x="600" y="524" font-size="22" font-weight="700" fill="#16201D" text-anchor="middle">Front glass (where your fish greets you)</text><rect x="190" y="158" width="26" height="70" rx="8" fill="#4B5B55"/><text x="230" y="188.0" font-size="20" font-weight="400" fill="#16201D" text-anchor="start">Filter intake</text><rect x="690" y="160" width="320" height="16" rx="8" fill="#4B5B55"/><path d="M710,180 l0,30" stroke="#6BA9B8" stroke-width="3" marker-end=""/><path d="M750,180 l0,30" stroke="#6BA9B8" stroke-width="3" marker-end=""/><path d="M790,180 l0,30" stroke="#6BA9B8" stroke-width="3" marker-end=""/><path d="M830,180 l0,30" stroke="#6BA9B8" stroke-width="3" marker-end=""/><path d="M870,180 l0,30" stroke="#6BA9B8" stroke-width="3" marker-end=""/><path d="M910,180 l0,30" stroke="#6BA9B8" stroke-width="3" marker-end=""/><path d="M950,180 l0,30" stroke="#6BA9B8" stroke-width="3" marker-end=""/><path d="M990,180 l0,30" stroke="#6BA9B8" stroke-width="3" marker-end=""/><text x="850" y="240" font-size="20" font-weight="400" fill="#16201D" text-anchor="middle">Filter return / spray bar</text><rect x="570" y="164" width="110" height="24" rx="12" fill="#B06A2A" stroke="#16201D" stroke-width="2"/><text x="625" y="220.0" font-size="19" font-weight="400" fill="#16201D" text-anchor="middle">Heater in</text><text x="625" y="244.7" font-size="19" font-weight="400" fill="#16201D" text-anchor="middle">a guard</text><rect x="190" y="418" width="14" height="48" rx="7" fill="#fff" stroke="#16201D" stroke-width="2"/><circle cx="197" cy="464" r="9" fill="#A62F28"/><text x="220" y="434.0" font-size="19" font-weight="400" fill="#16201D" text-anchor="start">Thermometer</text><text x="220" y="458.7" font-size="19" font-weight="400" fill="#16201D" text-anchor="start">80–86°F</text><ellipse cx="900" cy="388" rx="90" ry="55" fill="#9C9A8E" stroke="#16201D" stroke-width="2"/><text x="900" y="378.0" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">One heavy,</text><text x="900" y="402.7" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">smooth rock</text><g transform="translate(450 280) scale(0.32)"><defs><linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B92B25"/><stop offset=".55" stop-color="#D9452F"/><stop offset="1" stop-color="#EE9A3A"/></linearGradient>
